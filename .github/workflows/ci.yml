name: ci

on:
  pull_request: 
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.5"

      - name: CLI Test
        run: go test ./internal/cli

      - name: Install Gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Go Security Test
        run: gosec ./...

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Run PyTest
        run: pytest ./reports/scripts
      
      - name: Run Bandit
        run: bandit -r ./reports/scripts/generate_reports.py
  
  styles:
    name: Style
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.5"
        
      - name: Formatting Verification
        run: test -z $(go fmt ./...)

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      
      - name: Go Linting with staticcheck
        run: staticcheck ./...

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Run PyLint
        run: pylint ./reports/scripts/generate_reports.py
