services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=clinical_trials
    volumes:
      - postgres_data:/var/lib/postgresql/data

  go-cli:
    image: ghcr.io/mucusscraper/clinical-trials-disease-analytics-pipeline/go-cli:latest
    container_name: go_app
    depends_on:
      - postgres
    environment:
      - DB_HOST=postgres
      - DB_USER=admin
      - DB_PASSWORD=admin
      - DB_NAME=clinical_trials
    stdin_open: true
    tty: true
    volumes:
      - ./reports/outputs:/reports/outputs
      - ./sql/schema:/app/sql/schema

volumes:
  postgres_data: